<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Monthly Card Deck</title>

<style>
:root{
  --bg: #F8F3EF;
  --card-w: clamp(220px, 65vw, 420px);
  --overlap-factor: 0.60;
}

html,body{
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:"Inter",Inter,Arial,sans-serif;
  background:var(--bg);
}

.app{
  width:100%;
  max-width:100%;
  margin:0;
  height:100%;
  padding:0px 0px;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}

.viewport{
  width:100%;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  height:auto;
  min-height:0;
  padding-top:60px;
  padding-bottom:100px;
  padding-left:18px;
  padding-right:18px;
  overflow:visible;
}

.viewport.revisit{
  transform:translateY(30px);
}

.scroller{
  display:flex;
  width:100%;
  overflow-x:auto;
  overflow-y:visible;
  scroll-snap-type:none;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

.scroller::-webkit-scrollbar{
  display:none;
}

.track{
  display:flex;
  align-items:flex-end;
  padding-top:40px;
  padding-bottom:80px;
  overflow:visible;
}

.card{
  flex:0 0 auto;
  width:var(--card-w);
  aspect-ratio:750/1050;
  position:relative;
  scroll-snap-align:center;
  margin-right:calc(var(--card-w) * -1 * var(--overlap-factor));
  margin-top:110px;
  transform-origin:center bottom;
  transition:transform 120ms ease;
  will-change:transform;
  cursor:pointer;
  perspective:1200px;
}

.card__inner{
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform 700ms cubic-bezier(.2,.9,.25,1);
}

.card.flipped .card__inner{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  border-radius:16px;
  overflow:hidden;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  box-shadow:
    0 6px 12px rgba(0,0,0,0.35),
    0 2px 6px rgba(0,0,0,0.25);
}

.card.flipped .face{
  box-shadow:
    0 6px 12px rgba(0,0,0,0.4),
    0 2px 6px rgba(0,0,0,0.3);
}

.face img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.face.front{
  transform:rotateY(180deg);
}

.card.selected{
  transform:translateY(20px) scale(1.25)!important;
}

.card.blur:not(.flipped){
  opacity:0;
}

.revealPanel{
  display:none;
  width:100%;
  flex-direction:column;
  align-items:center;
  margin-top:clamp(6px, 6vw, 60px);
  margin-bottom:clamp(20px, 4vw, 40px);
  text-align:center;
  position:relative;
  z-index:10;
}

.revealPanel .label{
  font-size:clamp(18px, 2.2vw, 28px);
  font-weight:400;
}

.revealPanel .word{
  font-size:clamp(22px, 3vw, 38px);
  font-weight:600;
  text-transform:uppercase;
}

.revisitHeader{
  display:none;
  font-weight:400;
  margin-bottom:12px;
  text-align:center;
  font-size:clamp(15px, 2.5vw, 34px);
}

.welcomeHeader{
  font-weight:400;
  margin-top:clamp(6px, 3vw, 30px);
  margin-bottom:12px;
  text-align:center;
  font-size:clamp(15px, 2.5vw, 34px);
}

.loadingMessage,
.errorMessage{
  width:100%;
  text-align:center;
  font-size:16px;
  font-weight:400;
  padding:30px 20px;
  box-sizing:border-box;
}

.errorMessage{
  display:none;
}

/* ========================= */
/* TABLET + LARGER SCREENS  */
/* ========================= */

@media (min-width:768px){

  .viewport{
    padding-top:40px;
    padding-bottom:40px;
  }

  .card.selected{
    transform:translateY(55px) scale(1.25)!important;
  }

  .revisitHeader,
  .welcomeHeader{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="welcomeHeader" id="welcomeHeader">
    Swipe and tap for your daily card.
  </div>

  <div class="revealPanel" id="revealPanel">

    <div class="revisitHeader" id="revisitHeader">
      This was your card for today
    </div>

    <!--
      Reveal word remains available in the data structure
      but is not currently displayed.
    -->
    <div class="word" id="revealWord"></div>

  </div>

  <div class="loadingMessage" id="loadingMessage">
    Loading your cards...
  </div>

  <div class="errorMessage" id="errorMessage">
    This card deck is temporarily unavailable.
  </div>

  <div class="viewport" id="viewport">

    <div class="scroller" id="scroller">

      <div class="track" id="track"></div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://tppyzexttkuvcobbbmaz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VZiTsc0JGVx6tVf2Zu-9uQ_-FwjGpQW";


/* =========================================================
   ANALYTICS
   ========================================================= */

const APP_NAME = "ETL";
const CONTENT_TYPE = "card deck";
const TITLE_NAME = "MT";

async function trackAnalytics(eventType, metadata = {}) {

  try {

    await fetch(
      `${SUPABASE_URL}/rest/v1/analytics_card`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          Prefer: "return=minimal"
        },

        body: JSON.stringify({
          app_name: APP_NAME,
          content_type: CONTENT_TYPE,
          title_name: TITLE_NAME,
          event_type: eventType,
          metadata: metadata
        })
      }
    ).catch(() => {});

  } catch(err) {

    console.log("Analytics error:", err);

  }

}


/* =========================================================
   CURRENT DATE
   =========================================================
   
   Uses the user's local date rather than UTC.
   This is important because the deck changes on the
   1st of the month according to the user's local date.
   ========================================================= */

function getLocalDate(){

  const now = new Date();

  return {
    year: now.getFullYear(),
    month: now.getMonth() + 1,
    day: now.getDate()
  };

}


/* =========================================================
   SUPABASE REQUEST HELPER
   ========================================================= */

async function supabaseFetch(endpoint){

  const response = await fetch(
    `${SUPABASE_URL}${endpoint}`,
    {
      method: "GET",

      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      }
    }
  );

  if(!response.ok){

    const errorText = await response.text();

    throw new Error(
      `Supabase request failed: ${response.status} ${errorText}`
    );

  }

  return await response.json();

}


/* =========================================================
   GET CURRENT ACTIVE DECK
   ========================================================= */

async function getCurrentDeck(){

  const { month } = getLocalDate();

  const endpoint =
    `/rest/v1/monthly_card_deck` +
    `?month=eq.${month}` +
    `&active=eq.true` +
    `&select=id,deck_id,month,title,theme,url_card_back,active` +
    `&limit=1`;

  const decks = await supabaseFetch(endpoint);

  if(!decks || decks.length === 0){

    throw new Error(
      `No active deck found for month ${month}`
    );

  }

  const deck = decks[0];

  if(!deck.deck_id){

    throw new Error(
      "The active deck does not have a deck_id."
    );

  }

  if(!deck.url_card_back){

    throw new Error(
      `Deck ${deck.deck_id} does not have a card back URL.`
    );

  }

  return deck;

}


/* =========================================================
   GET CARDS FOR CURRENT DECK
   ========================================================= */

async function getDeckCards(deckId){

  const endpoint =
    `/rest/v1/monthly_card_deck_cards` +
    `?deck_id=eq.${encodeURIComponent(deckId)}` +
    `&select=id,deck_id,card_number,url_card,reveal_word` +
    `&order=card_number.asc`;

  const cards = await supabaseFetch(endpoint);

  if(!cards || cards.length === 0){

    throw new Error(
      `No cards found for deck ${deckId}`
    );

  }

  return cards;

}


/* =========================================================
   CARD LOCATION
   ========================================================= */

const SLOTS = [

  { x:-3, y:60, rot:-18, scale:1 },

  { x:-2, y:40, rot:-12, scale:1 },

  { x:-1, y:20, rot:-6, scale:1 },

  { x:0, y:-40, rot:0, scale:1 },

  { x:1, y:20, rot:6, scale:1 },

  { x:2, y:40, rot:12, scale:1 },

  { x:3, y:60, rot:18, scale:1 }

];


/* =========================================================
   GLOBAL DECK VARIABLES
   ========================================================= */

let CURRENT_DECK = null;
let DECK_CARDS = [];
let BACK_IMAGE = "";


/* =========================================================
   DOM ELEMENTS
   ========================================================= */

const track =
  document.getElementById("track");

const scroller =
  document.getElementById("scroller");

const revealPanel =
  document.getElementById("revealPanel");

const revealWord =
  document.getElementById("revealWord");

const welcomeHeader =
  document.getElementById("welcomeHeader");

const revisitHeader =
  document.getElementById("revisitHeader");

const viewport =
  document.getElementById("viewport");

const loadingMessage =
  document.getElementById("loadingMessage");

const errorMessage =
  document.getElementById("errorMessage");


/* =========================================================
   CREATE CARDS
   ========================================================= */

function createCards(cards){

  track.innerHTML = "";

  cards.forEach((cardData) => {

    const number = String(cardData.card_number);

    const card = document.createElement("div");

    card.className = "card";

    card.dataset.number = number;

    card.dataset.src = cardData.url_card;

    card.dataset.word =
      cardData.reveal_word || "";

    card.dataset.deckId =
      cardData.deck_id;


    /* ---------- INNER ---------- */

    const inner =
      document.createElement("div");

    inner.className = "card__inner";


    /* ---------- BACK ---------- */

    const back =
      document.createElement("div");

    back.className = "face back";

    back.innerHTML =
      `<img src="${BACK_IMAGE}" alt="" />`;


    /* ---------- FRONT ---------- */

    const front =
      document.createElement("div");

    front.className = "face front";

    front.innerHTML =
      `<img data-src="${cardData.url_card}" alt="" />`;


    inner.appendChild(back);

    inner.appendChild(front);

    card.appendChild(inner);

    track.appendChild(card);

  });


  /* =======================================================
     DUPLICATE DECK
     ======================================================= */

  Array.from(track.children).forEach(card => {

    track.appendChild(
      card.cloneNode(true)
    );

  });

}


/* =========================================================
   CENTER DETECTION
   ========================================================= */

function updateCenter(){

  /*
    Once a card has been selected and flipped,
    stop updating the carousel layout.
  */

  if(document.querySelector(".card.selected")){

    return;

  }


  const cards =
    [...document.querySelectorAll(".card")];


  const scRect =
    scroller.getBoundingClientRect();


  const centerX =
    scRect.left +
    scRect.width / 2;


  let closest = null;

  let closestDist = Infinity;


  cards.forEach(card => {

    card.classList.remove("center");


    const r =
      card.getBoundingClientRect();


    const cx =
      r.left +
      r.width / 2;


    const dist =
      cx - centerX;


    const abs =
      Math.abs(dist);


    if(abs < closestDist){

      closestDist = abs;

      closest = card;

    }

  });


  if(!closest) return;


  const centerIndex =
    cards.indexOf(closest);


  cards.forEach((card, i) => {

    const offset =
      i - centerIndex;


    /* ---------------------------------------------
       Only show 7 cards
       --------------------------------------------- */

    if(offset < -3 || offset > 3){

      card.style.opacity = 0;

      card.style.pointerEvents = "none";

      return;

    }


    const slot =
      SLOTS[offset + 3];


    const lift =
      offset === 0 ? -55 : 0;


    /* ---------------------------------------------
       Fan size
       --------------------------------------------- */

    const fanScale = 0.82;

    const isCenter = offset === 0;

    const isSelected =
      card.classList.contains("selected");


    const scale =
      isSelected ? 1 : fanScale;


    /* ---------------------------------------------
       Hidden cards after selection
       --------------------------------------------- */

    if(card.classList.contains("blur")){

      card.style.opacity = "0";

      card.style.pointerEvents = "none";

      return;

    }


    /* ---------------------------------------------
       Normal visible cards
       --------------------------------------------- */

    card.style.opacity = "1";

    card.style.pointerEvents = "auto";


    card.style.transform = `
      translateX(${offset * -14}px)
      translateY(${slot.y + lift}px)
      rotate(${slot.rot}deg)
      scale(${scale})
    `;


    card.style.zIndex =
      100 - offset;

  });


  closest.classList.add("center");

}


/* =========================================================
   SNAP CENTER CARD
   ========================================================= */

function snapCenterCard(){

  const centerCard =
    document.querySelector(".card.center");


  if(!centerCard) return;


  const scrollerRect =
    scroller.getBoundingClientRect();


  const cardRect =
    centerCard.getBoundingClientRect();


  const cardCenter =
    cardRect.left +
    cardRect.width / 2;


  const viewportCenter =
    scrollerRect.left +
    scrollerRect.width / 2;


  const diff =
    cardCenter -
    viewportCenter;


  scroller.scrollLeft += diff;

}


/* =========================================================
   SCROLLER
   ========================================================= */

let ticking = false;

let snapTimeout;


scroller.addEventListener("scroll", () => {

  if(!ticking){

    requestAnimationFrame(() => {

      const halfWidth =
        scroller.scrollWidth / 2;


      /*
        Infinite looping.
      */

      if(scroller.scrollLeft >= halfWidth){

        scroller.scrollLeft -= halfWidth;

      }


      if(scroller.scrollLeft <= 0){

        scroller.scrollLeft += halfWidth;

      }


      updateCenter();


      ticking = false;

    });


    ticking = true;

  }


  clearTimeout(snapTimeout);


  snapTimeout = setTimeout(() => {

    snapCenterCard();

  }, 120);

});


/* =========================================================
   SELECT CENTER CARD
   ========================================================= */

scroller.addEventListener("click", () => {

  const center =
    document.querySelector(".card.center");


  if(!center) return;


  if(center.classList.contains("selected")){

    return;

  }


  /* ---------------------------------------------
     Lazy load front image
     --------------------------------------------- */

  const img =
    center.querySelector(
      ".face.front img"
    );


 if(img && !img.getAttribute("src")){

  img.src =
    img.dataset.src;

}


  /* ---------------------------------------------
     Flip selected card
     --------------------------------------------- */

  center.classList.add(
    "selected",
    "flipped"
  );


  center.scrollIntoView({
    inline:"center",
    block:"nearest"
  });


  /* ---------------------------------------------
     Lock selected card
     --------------------------------------------- */

  scroller.style.overflowX = "hidden";

  scroller.style.touchAction = "pan-y";


  /* ---------------------------------------------
     Hide all other cards
     --------------------------------------------- */

  document.querySelectorAll(".card").forEach(c => {

    if(c !== center){

      c.classList.add("blur");

      c.style.opacity = "0";

      c.style.pointerEvents = "none";

    }

  });


  /* ---------------------------------------------
     UI
     --------------------------------------------- */

  revealPanel.style.display = "flex";

  revisitHeader.style.display = "none";

  welcomeHeader.style.display = "none";


  /* ---------------------------------------------
     DAILY CARD DATA
     --------------------------------------------- */

  const today =
    getLocalDate();


  const dateString =
    `${today.year}-${String(today.month).padStart(2,"0")}-${String(today.day).padStart(2,"0")}`;


  const cardNumber =
    center.dataset.number;


  const deckId =
    center.dataset.deckId;


  const affirmation =
    center.dataset.word || "";

  /* ---------------------------------------------
     ANALYTICS
     --------------------------------------------- */

  trackAnalytics("card_drawn", {

    card_number: cardNumber,

    deck_id: deckId,

    reveal_word: affirmation

  });


  /* ---------------------------------------------
     SAVE DAILY CARD
     --------------------------------------------- */

 const index =
  Array.from(
    document.querySelectorAll(".card")
  ).indexOf(center);

localStorage.setItem(
  "dailyMonthlyCard",
  JSON.stringify({

    cardIndex: index,

    cardNumber: center.dataset.number,

    affirmation: center.dataset.word,

    deckId: center.dataset.deckId,

    date: dateString

  })
);

});


/* =========================================================
   REVISIT TODAY'S SAVED CARD
   ========================================================= */

function restoreSavedCard(){

  const savedRaw =
    localStorage.getItem("dailyMonthlyCard");

  if(!savedRaw){
    return false;
  }

  let saved;

  try{

    saved =
      JSON.parse(savedRaw);

  }catch(err){

    localStorage.removeItem(
      "dailyMonthlyCard"
    );

    return false;

  }


  /* ---------------------------------------------
     CURRENT DATE
     --------------------------------------------- */

  const today =
    getLocalDate();

  const todayString =
    `${today.year}-${String(today.month).padStart(2,"0")}-${String(today.day).padStart(2,"0")}`;


  /* ---------------------------------------------
     CHECK DATE
     --------------------------------------------- */

  if(saved.date !== todayString){

    localStorage.removeItem(
      "dailyMonthlyCard"
    );

    return false;

  }


  /* ---------------------------------------------
     CHECK DECK
     --------------------------------------------- */

  if(
    saved.deckId !== CURRENT_DECK.deck_id
  ){

    localStorage.removeItem(
      "dailyMonthlyCard"
    );

    return false;

  }


  /* ---------------------------------------------
     GET EXACT SAVED CARD
     --------------------------------------------- */

  const cards =
    document.querySelectorAll(".card");

  const savedCard =
    cards[saved.cardIndex];


  if(!savedCard){

    localStorage.removeItem(
      "dailyMonthlyCard"
    );

    return false;

  }


  /* ---------------------------------------------
     IMPORTANT:
     The initial updateCenter() may have hidden
     this card because the carousel initially
     started at a random position.
     Make the saved card visible again.
     --------------------------------------------- */

  savedCard.style.opacity = "1";

  savedCard.style.pointerEvents = "auto";


  /* ---------------------------------------------
     REVISIT POSITION
     --------------------------------------------- */

  viewport.classList.add("revisit");


  /* ---------------------------------------------
     LAZY LOAD FRONT IMAGE
     --------------------------------------------- */

  const img =
    savedCard.querySelector(
      ".face.front img"
    );

 if(img && !img.getAttribute("src")){

  img.src =
    img.dataset.src;

}


  /* ---------------------------------------------
     SELECT + FLIP EXACT SAVED CARD
     --------------------------------------------- */

  savedCard.classList.add(
    "selected",
    "flipped"
  );


  /* ---------------------------------------------
     ANALYTICS
     --------------------------------------------- */

  trackAnalytics(
    "card_revisited",
    {
      card_number:
        savedCard.dataset.number,

      deck_id:
        CURRENT_DECK.deck_id,

      affirmation:
        savedCard.dataset.word || ""
    }
  );


  /* ---------------------------------------------
     LOCK THE SELECTED CARD
     --------------------------------------------- */

  scroller.style.overflowX =
    "hidden";

  scroller.style.touchAction =
    "pan-y";


  /* ---------------------------------------------
     SCROLL DIRECTLY TO THE SAVED CARD
     --------------------------------------------- */

  savedCard.scrollIntoView({
    inline: "center",
    block: "nearest"
  });


  /* ---------------------------------------------
     HIDE ALL OTHER CARDS
     --------------------------------------------- */

  cards.forEach(c => {

    if(c !== savedCard){

      c.classList.add("blur");

      c.style.opacity = "0";

      c.style.pointerEvents = "none";

    }

  });


  /* ---------------------------------------------
     SHOW REVISIT MESSAGE
     --------------------------------------------- */

  revealPanel.style.display =
    "flex";

  revisitHeader.style.display =
    "block";

  welcomeHeader.style.display =
    "none";


  return true;

}

/* =========================================================
   INITIALISE MONTHLY DECK
   ========================================================= */

async function initialiseDeck(){

  try{

    /* ---------------------------------------------
       Show loading state
       --------------------------------------------- */

    loadingMessage.style.display =
      "block";

    errorMessage.style.display =
      "none";


    /* ---------------------------------------------
       Get active deck for current month
       --------------------------------------------- */

    CURRENT_DECK =
      await getCurrentDeck();


    console.log(
      "Active monthly deck:",
      CURRENT_DECK
    );


    /* ---------------------------------------------
       Store card back URL
       --------------------------------------------- */

    BACK_IMAGE =
      CURRENT_DECK.url_card_back;


    /* ---------------------------------------------
       Get cards belonging to deck_id
       --------------------------------------------- */

    DECK_CARDS =
      await getDeckCards(
        CURRENT_DECK.deck_id
      );


    console.log(
      "Cards loaded:",
      DECK_CARDS
    );


    /* ---------------------------------------------
       Validate card data
       --------------------------------------------- */

    DECK_CARDS =
      DECK_CARDS.filter(card =>

        card.card_number &&
        card.url_card

      );


    if(DECK_CARDS.length === 0){

      throw new Error(
        `Deck ${CURRENT_DECK.deck_id} contains no usable cards.`
      );

    }


    /* ---------------------------------------------
       Create the visual deck
       --------------------------------------------- */

    createCards(
      DECK_CARDS
    );


    /* ---------------------------------------------
       Hide loading
       --------------------------------------------- */

    loadingMessage.style.display =
      "none";


    /* ---------------------------------------------
       Analytics: deck opened
       --------------------------------------------- */

    trackAnalytics(
      "deck_opened",
      {
        deck_id:
          CURRENT_DECK.deck_id
      }
    );


    /* ---------------------------------------------
       Initial carousel position
       --------------------------------------------- */

    requestAnimationFrame(() => {

      const cards =
        track.querySelectorAll(".card");


      if(!cards.length) return;


      const randomIndex =
        Math.floor(
          Math.random() *
          cards.length
        );


      const middleCard =
        cards[randomIndex];


      const scrollerRect =
        scroller.getBoundingClientRect();


      const cardRect =
        middleCard.getBoundingClientRect();


      const offset =
        (
          cardRect.left +
          cardRect.width / 2
        )
        -
        (
          scrollerRect.left +
          scrollerRect.width / 2
        );


      scroller.scrollLeft +=
        offset;


      setTimeout(() => {

        updateCenter();

        /*
          Check whether the user has
          already selected today's card.
        */

        restoreSavedCard();

      }, 50);

    });


  }catch(err){

    console.error(
      "Monthly card deck error:",
      err
    );


    loadingMessage.style.display =
      "none";


    errorMessage.style.display =
      "block";


    /*
      Analytics for debugging.
    */

    trackAnalytics(
      "deck_error",
      {
        error:
          String(err.message || err)
      }
    );

  }

}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  "load",
  initialiseDeck
);

</script>

</body>
</html>
